<h1>ניהול רוכשים</h1>

<div dir="rtl" class="flex justify-content-center">
    <button class="but"
        type="button" 
        (click)="showDialog()" 
        pButton 
        icon="pi pi-external-link" 
        label="פרטי רוכשים">
    </button>
</div>
<p-dialog 
    header="Header" 
    [resizable]="false" 
    [modal]="true" 
    [maximizable]="true" 
    appendTo="body" 
    [(visible)]="dialogVisible" 
    [style]="{width: '75vw'}" 
    [contentStyle]="{height: '300px'}">
        <p-table 
            [value]="customer" 
            [scrollable]="true" 
            scrollHeight="flex" 
            [tableStyle]="{'min-width': '50rem'}">
                <ng-template pTemplate="header" >
                    <tr>
                        <th>
                            שם
                        </th>
                        <th>
                            כתובת
                        </th>
                        <th>
                            מייל
                        </th>
                        <th>
                            טלפון
                        </th>
                    </tr>
                </ng-template>
                <ng-template pTemplate="body" let-customer>
                    <tr>
                        <td>
                            {{customer.nameCustomer}}
                        </td>
                        <td>
                            {{customer.adress}}
                        </td>
                        <td>
                            {{customer.emailCustomer}}
                        </td>
                        <td>
                            {{customer.phoneCustomet}}
                        </td>
                    </tr>
                </ng-template>
        </p-table>
        <ng-template pTemplate="footer">
            <button 
                type="button" 
                pButton 
                pRipple 
                icon="pi pi-times" 
                (click)="dialogVisible=false" 
                label="סגור" 
                class="p-button-text">
            </button>
        </ng-template>
</p-dialog>
<p-toast></p-toast>

<div class="card" dir="rtl">
    <p-table #dt [value]="gifts$" [rows]="6
      " [paginator]="true" [globalFilterFields]="['name','country.name','representative.name','status']"
        [rowHover]="true" dataKey="id" currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
        [showCurrentPageReport]="true">
        <ng-template pTemplate="caption">
            <div class="p-d-flex p-ai-center p-jc-between">
            </div>
        </ng-template>
        <ng-template pTemplate="header">
            <tr>
                <th></th>
                    <th pSortableColumn="Image">תמונה </th>
                <th pSortableColumn="nameGift">שם מתנה <p-sortIcon field="nameGift"></p-sortIcon></th>
                <th pSortableColumn="priceTicket">מחיר <p-sortIcon field="priceTicket"></p-sortIcon></th>
                <th pSortableColumn="categoryName">מספר רוכשים <p-sortIcon field="categoryName"></p-sortIcon></th>
                


                <th></th>

            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-gift dir="rtl">
            <tr>
                <td></td>
                <td>
                    <img [src]="''+gift.image" [alt]="gift.nameGift" width="100" class="shadow-4"
                        style="justify-content: center;" />
                </td>
                <td>{{gift.nameGift}}</td>
                <td>{{gift.priceTicket | currency:'ILS'}}</td>
                <td style="font-family: Georgia, 'Times New Roman', Times, serif; font-size: 20px; font-weight: 50px;" >{{gift.numBuyers}}</td>
               
                <td></td>
            </tr>
        </ng-template>
    </p-table>
</div>
<p-confirmDialog [style]="{width: '450px'}"></p-confirmDialog>
