<div class="card login-signup-container">
    <p-messages (value)="messages" [enableService]="false" />

    <div class="content-container">
        <!-- Login Section -->
        <div class="login-section">
            <div class="input-group">
                <label for="username" class="input-label">שם משתמש</label>
                <input pInputText id="username" type="text" [(ngModel)]="login.userName" class="input-field" />
            </div>
            <div class="input-group">
                <label for="password" class="input-label">סיסמה</label>

                <input pri pInputText id="password" type="password" [(ngModel)]="login.password" class="input-field" />
            </div>
            <button icon="  pi pi-arrow-circle-left  " pButton (click)="logIn()" class="login-button">
                    כניסה למערכת  
            </button>
        </div>

        <!-- Divider -->
        <div class="divider">
            <div class="divider-line"></div>
            <span class="divider-text">OR</span>
            <div class="divider-line"></div>
        </div>

        <!-- Sign Up Section -->
        <div class="signup-section">
            <button label="Register" icon="pi pi-user-plus" pButton (click)="navigateToRegister()" severity="success"
                class="signup-button">

            </button>
            <!-- <p-button type="button" pRipple (click)="showSuccess()" label="Success" severity="success" /> -->
            <!-- <p-button type="button" pRipple (click)="showError()" label="Error" severity="danger" /> -->

        </div>

    </div>
</div>
